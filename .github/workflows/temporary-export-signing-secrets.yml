name: Temporary encrypted signing-secret export

on:
  workflow_dispatch:
    inputs:
      recipient_certificate_b64:
        description: Base64-encoded PEM X.509 recipient certificate (public certificate only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-signing-secret-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Encrypt signing payload for the one-time recipient
        id: encrypt
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
          RECIPIENT_CERTIFICATE_B64: ${{ inputs.recipient_certificate_b64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          work_dir="${RUNNER_TEMP}/signing-secret-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          encrypted_dir="${RUNNER_TEMP}/encrypted-signing-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            find "${work_dir}" -type f -exec shred -u {} + 2>/dev/null || rm -rf -- "${work_dir}"
            rm -rf -- "${work_dir}"
          }
          trap cleanup EXIT
          mkdir -m 700 -- "${work_dir}" "${encrypted_dir}"

          WORK_DIR="${work_dir}" python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          required = (
              "SIGNING_KEY",
              "KEY_STORE_PASSWORD",
              "KEY_ALIAS",
              "KEY_PASSWORD",
              "SIGNING_CERT_SHA256",
          )
          if any(not os.environ.get(name) for name in required):
              raise SystemExit("required signing secret is unavailable")

          work_dir = Path(os.environ["WORK_DIR"])
          try:
              recipient = base64.b64decode(
                  os.environ["RECIPIENT_CERTIFICATE_B64"], validate=True
              )
          except (ValueError, binascii.Error):
              raise SystemExit("recipient certificate input is not valid base64") from None
          if b"BEGIN CERTIFICATE" not in recipient:
              raise SystemExit("recipient input is not a PEM X.509 certificate")
          (work_dir / "recipient.pem").write_bytes(recipient)

          payload = {name: os.environ[name] for name in required}
          serialized = json.dumps(
              payload, ensure_ascii=True, separators=(",", ":"), sort_keys=True
          ).encode("utf-8")
          if len(serialized) >= 65536:
              raise SystemExit("signing payload exceeds the 64 KiB migration limit")
          (work_dir / "payload.json").write_bytes(serialized)
          PY

          openssl x509 -in "${work_dir}/recipient.pem" -noout >/dev/null
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -recip "${work_dir}/recipient.pem" \
            -in "${work_dir}/payload.json" \
            -out "${encrypted_dir}/signing-migration.der"
          test -s "${encrypted_dir}/signing-migration.der"
          chmod 600 "${encrypted_dir}/signing-migration.der"
          echo "encrypted_dir=${encrypted_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload encrypted DER only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.encrypt.outputs.encrypted_dir }}/signing-migration.der
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

      - name: Remove encrypted runner staging
        if: always()
        shell: bash
        env:
          ENCRYPTED_DIR: ${{ steps.encrypt.outputs.encrypted_dir }}
        run: |
          set -euo pipefail
          if [[ -n "${ENCRYPTED_DIR}" && "${ENCRYPTED_DIR}" == "${RUNNER_TEMP}"/* ]]; then
            rm -rf -- "${ENCRYPTED_DIR}"
          fi
