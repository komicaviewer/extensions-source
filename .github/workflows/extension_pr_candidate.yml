name: Extension repair candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: extension-repair-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    if: ${{ startsWith(github.head_ref, 'automation/extension-fix-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR identity, issue, and changed paths from base policy
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "${RUNNER_TEMP}/trusted" .git/extension-automation
          cp scripts/extension_automation.py "${RUNNER_TEMP}/trusted/extension_automation.py"
          cp release-catalog.json "${RUNNER_TEMP}/trusted/release-catalog.json"
          jq -r '.pull_request.body' "${GITHUB_EVENT_PATH}" > .git/extension-automation/pr-body.md
          python3 "${RUNNER_TEMP}/trusted/extension_automation.py" extract-issue-number \
            --body-file .git/extension-automation/pr-body.md --github-output "${GITHUB_OUTPUT}"
          issue_number=$(python3 "${RUNNER_TEMP}/trusted/extension_automation.py" extract-issue-number \
            --body-file .git/extension-automation/pr-body.md)
          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq .body \
            > .git/extension-automation/issue-body.md
          python3 "${RUNNER_TEMP}/trusted/extension_automation.py" prepare-issue \
            --body-file .git/extension-automation/issue-body.md \
            --catalog "${RUNNER_TEMP}/trusted/release-catalog.json" \
            --output .git/extension-automation/health.json --github-output "${GITHUB_OUTPUT}"
          git fetch --no-tags origin "${HEAD_SHA}"
          diff_base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${HEAD_SHA}")
          python3 "${RUNNER_TEMP}/trusted/extension_automation.py" validate-paths \
            --input .git/extension-automation/health.json \
            --base "${diff_base}" --head "${HEAD_SHA}"
          git checkout --detach "${HEAD_SHA}"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          cache-read-only: true

      - name: Checkout pinned NewsHub extension API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: komicaviewer/NewsHub
          ref: 53d421492614c13e2a5984b4991513d993d44246
          path: .trusted-newshub
          persist-credentials: false

      - name: Build pinned extension API locally
        run: ./.trusted-newshub/gradlew -p .trusted-newshub --no-daemon :extension-api:assembleDebug

      - name: Install Android build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Test Source and build one unsigned APK
        env:
          TEST_TASK: ${{ steps.health.outputs.test_task }}
          ASSEMBLE_TASK: ${{ steps.health.outputs.assemble_task }}
        run: ./gradlew --no-daemon -PnewshubDir="$GITHUB_WORKSPACE/.trusted-newshub" "${TEST_TASK}" "${ASSEMBLE_TASK}"

      - name: Create exact-head ephemeral test-signed candidate
        env:
          APK_OUTPUT: ${{ steps.health.outputs.apk_output }}
          SOURCE_ID: ${{ steps.health.outputs.source_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${APK_OUTPUT}"
          mkdir -p candidate
          password=$(openssl rand -hex 24)
          keystore="${RUNNER_TEMP}/ephemeral-candidate.jks"
          trap 'rm -f "${keystore}"' EXIT
          keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" \
            -keypass "${password}" -alias candidate -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=NewsHub ephemeral PR candidate"
          cp "${APK_OUTPUT}" candidate/extension-candidate.apk
          "${APKSIGNER}" sign --ks "${keystore}" --ks-key-alias candidate \
            --ks-pass "pass:${password}" --key-pass "pass:${password}" candidate/extension-candidate.apk
          "${APKSIGNER}" verify --verbose --print-certs candidate/extension-candidate.apk
          apk_sha=$(sha256sum candidate/extension-candidate.apk | cut -d' ' -f1)
          jq -n --arg sourceId "${SOURCE_ID}" --arg headSha "${HEAD_SHA}" \
            --arg apkSha256 "${apk_sha}" --argjson pullRequest "${PR_NUMBER}" \
            '{schemaVersion: 1, sourceId: $sourceId, pullRequest: $pullRequest, headSha: $headSha, apkSha256: $apkSha256, signingPurpose: "ephemeral-test-only"}' \
            > candidate/candidate-manifest.json

      - name: Upload zero-secret candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 3
