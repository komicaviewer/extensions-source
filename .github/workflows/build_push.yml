name: Build & Publish Extensions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: extensions-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "AAPT=$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" >> $GITHUB_ENV
          echo "APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" >> $GITHUB_ENV

      - name: Validate signing secrets and set up keystore
        run: |
          for secret_name in SIGNING_KEY KEY_STORE_PASSWORD_INPUT KEY_ALIAS_INPUT KEY_PASSWORD_INPUT SIGNING_CERT_SHA256; do
            if [ -z "${!secret_name}" ]; then
              echo "Required signing secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done
          printf '%s' "${SIGNING_KEY}" | base64 --decode > keystore.jks
          keytool -list -keystore keystore.jks -storepass "${KEY_STORE_PASSWORD_INPUT}" \
            -alias "${KEY_ALIAS_INPUT}" >/dev/null
          echo "KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD_INPUT}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS_INPUT}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD_INPUT}" >> $GITHUB_ENV
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD_INPUT: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_INPUT: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}

      - name: Build and test release candidates
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew \
            :src:akraft:testDebugUnitTest \
            :src:nagatoyuki:testDebugUnitTest \
            :src:wtako:testDebugUnitTest \
            :src:twocat:testKomicaDebugUnitTest \
            :src:twocat:testKomica2DebugUnitTest \
            :src:sora:testKomicaDebugUnitTest \
            :src:sora:testKomica2DebugUnitTest \
            :src:zawarudo:testKomica2DebugUnitTest \
            :src:komica:assembleRelease \
            :src:komica2:assembleRelease

      - name: Verify signatures and collect release APKs
        shell: bash
        run: |
          mkdir -p output/apk
          expected_fingerprint=$(printf '%s' "${SIGNING_CERT_SHA256}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          for module in komica komica2; do
            apk="src/${module}/build/outputs/apk/release/${module}-release.apk"
            test -f "${apk}"
            actual_fingerprint=$("${APKSIGNER}" verify --verbose --print-certs "${apk}" | \
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | \
              tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
            if [ -z "${actual_fingerprint}" ] || [ "${actual_fingerprint}" != "${expected_fingerprint}" ]; then
              echo "Unexpected signing certificate for ${apk}" >&2
              exit 1
            fi
            version=$($AAPT dump badging "$apk" 2>/dev/null | grep "^package:" | \
              sed "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/")
            if [ -n "$version" ]; then
              apk_name="newshub-${module}-v${version}.apk"
              cp "$apk" "output/apk/${apk_name}"
              echo "Collected: ${apk_name}"
            else
              echo "Could not read version from ${apk}" >&2
              exit 1
            fi
          done

          artifact_count=$(find output/apk -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d '[:space:]')
          if [ "${artifact_count}" -ne 2 ]; then
            echo "Expected exactly 2 bundle APKs; files=${artifact_count}" >&2
            exit 1
          fi
          python3 scripts/validate_release_bundles.py output/apk

          if unzip -p output/apk/newshub-komica-v*.apk 'classes*.dex' | strings | grep -q 'Komica2Pixmicat'; then
            echo "komica.apk unexpectedly contains Komica2 Pixmicat classes" >&2
            exit 1
          fi
          for site in twocat sora; do
            if ! unzip -p output/apk/newshub-komica2-v*.apk 'classes*.dex' | strings | grep -q "${site}/komica2/pixmicat"; then
              echo "komica2.apk is missing ${site} Komica2 Pixmicat classes" >&2
              exit 1
            fi
          done
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions-apk
          path: output/apk/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extensions-source (for scripts)
        uses: actions/checkout@v4
        with:
          path: extensions-source

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: extensions-apk
          path: apks/

      - name: Install Android build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "AAPT=$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" >> $GITHUB_ENV

      - name: Checkout extensions repo
        uses: actions/checkout@v4
        with:
          repository: komicaviewer/extensions
          token: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
          path: extensions-repo

      - name: Generate index.json and publish
        run: |
          python3 extensions-source/scripts/validate_release_bundles.py apks/
          python3 extensions-source/scripts/generate_index.py apks/ extensions-repo/
          cd extensions-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update extensions index [skip ci]"
          git push
        env:
          AAPT: ${{ env.AAPT }}
