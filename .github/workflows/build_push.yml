name: Build Extension Release Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: extensions-release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release-needed: ${{ steps.release-needed.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: release-needed
        name: Detect release-affecting changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          paths="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if printf '%s\n' "$paths" | grep -Eq '^(src/|shared/|release-catalog\.json$|release-metadata/|release-icons/|build\.gradle\.kts$|settings\.gradle\.kts$|bundle\.gradle$|extension\.gradle$|gradle/|gradle\.properties$)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "No release-affecting paths changed; build verification will run without signing or publication."
          fi

      - name: Checkout pinned NewsHub extension API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: komicaviewer/NewsHub
          ref: 53d421492614c13e2a5984b4991513d993d44246
          path: .trusted-newshub
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Build pinned extension API locally
        run: ./.trusted-newshub/gradlew -p .trusted-newshub --no-daemon :extension-api:assembleDebug

      - name: Install Android build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "AAPT=$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Validate catalog and toolchain tests
        run: |
          python3 scripts/release_catalog.py validate
          python3 scripts/validate_source_manifests.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test Sources and assemble unsigned release APKs from catalog
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gradle_tasks < <(python3 scripts/release_catalog.py gradle-tasks)
          test "${#gradle_tasks[@]}" -gt 0
          ./gradlew -PnewshubDir="$GITHUB_WORKSPACE/.trusted-newshub" "${gradle_tasks[@]}"

      - name: Collect unsigned release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/unsigned
          while IFS=$'\t' read -r module apk; do
            test -f "${apk}"
            version=$("${AAPT}" dump badging "${apk}" 2>/dev/null | \
              sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/p" | head -n 1)
            test -n "${version}"
            apk_name=$(python3 scripts/release_catalog.py artifact-name "${module}" "${version}")
            cp "${apk}" "output/unsigned/${apk_name}"
          done < <(python3 scripts/release_catalog.py artifact-rows)

      - name: Upload unsigned APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extensions-unsigned
          path: output/unsigned/
          if-no-files-found: error
          retention-days: 1

  # Each matrix cell is bound to a different protected GitHub Environment. A
  # signer can access exactly one bundle key, never the complete key set.
  sign:
    needs: build
    if: needs.build.outputs.release-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [eyny, gamer, hackernews, komica, komica2, mobile01, ptt]
    environment: extension-sign-${{ matrix.module }}
    permissions:
      contents: read
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extensions-unsigned
          path: input

      - name: Install Android build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Sign one bundle
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD_INPUT: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_INPUT: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for secret_name in SIGNING_KEY KEY_STORE_PASSWORD_INPUT KEY_ALIAS_INPUT KEY_PASSWORD_INPUT SIGNING_CERT_SHA256; do
            test -n "${!secret_name}" || { echo "Missing ${secret_name}" >&2; exit 1; }
          done
          shopt -s nullglob
          apks=(input/newshub-${{ matrix.module }}-v*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p output
          apk="output/$(basename "${apks[0]}")"
          cp "${apks[0]}" "${apk}"
          signing_keystore="${RUNNER_TEMP}/${{ matrix.module }}.jks"
          trap 'rm -f "${signing_keystore}"' EXIT
          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${signing_keystore}"
          keytool -list -keystore "${signing_keystore}" -storepass "${KEY_STORE_PASSWORD_INPUT}" \
            -alias "${KEY_ALIAS_INPUT}" >/dev/null
          "${APKSIGNER}" sign --ks "${signing_keystore}" --ks-key-alias "${KEY_ALIAS_INPUT}" \
            --ks-pass env:KEY_STORE_PASSWORD_INPUT --key-pass env:KEY_PASSWORD_INPUT "${apk}"
          expected=$(printf '%s' "${SIGNING_CERT_SHA256}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          actual=$("${APKSIGNER}" verify --verbose --print-certs "${apk}" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | \
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test -n "${actual}" && test "${actual}" = "${expected}"

      - name: Upload signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-signed-${{ matrix.module }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout extensions-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: extensions-source
          persist-credentials: false

      - name: Download APK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extension-signed-*
          merge-multiple: true
          path: apks

      - name: Install Android build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "AAPT=$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Checkout current distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: komicaviewer/extensions
          token: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
          path: extensions-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and validate candidate distribution
        run: |
          python3 extensions-source/scripts/validate_release_bundles.py apks
          baseline_dir="${RUNNER_TEMP}/extensions-main-baseline"
          mkdir -p "${baseline_dir}"
          cp extensions-repo/index.json extensions-repo/index.min.json "${baseline_dir}/"
          python3 extensions-source/scripts/generate_index.py apks extensions-repo
          python3 extensions-source/scripts/validate_distribution.py \
            extensions-repo --baseline-dir "${baseline_dir}"

      - name: Push candidate branch and open pull request
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
        shell: bash
        run: |
          cd extensions-repo
          gh auth setup-git
          if [ -z "$(git status --porcelain -- apk icon index.json index.min.json metadata targets)" ]; then
            echo "Distribution is already current; no candidate PR is needed."
            exit 0
          fi
          candidate_branch="automation/extensions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "${candidate_branch}"
          publish_paths=(apk icon index.json index.min.json)
          [[ ! -e metadata ]] || publish_paths+=(metadata)
          [[ ! -e targets ]] || publish_paths+=(targets)
          git add -- "${publish_paths[@]}"
          unexpected=$(git diff --cached --name-only | grep -Ev '^(apk/|icon/|targets/apk/[^/]+\.apk$|metadata/timestamp\.json$|metadata/[1-9][0-9]*\.(root|snapshot|targets)\.json$|index\.json$|index\.min\.json$)' || true)
          if [ -n "${unexpected}" ]; then
            echo "Refusing to publish paths outside the distribution allowlist:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo "No staged distribution changes; no candidate PR is needed."
            exit 0
          }
          git commit -m "chore: 更新 extensions 發布候選"
          git push --set-upstream origin "${candidate_branch}"
          pr_url=$(gh pr create \
            --repo komicaviewer/extensions \
            --base main \
            --head "${candidate_branch}" \
            --title "chore: 更新 extensions 發布候選" \
            --body "由 extensions-source workflow 產生並完成完整性、簽章與歷史相容性驗證。來源：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          gh pr merge "${pr_url}" --repo komicaviewer/extensions --auto --squash --delete-branch
