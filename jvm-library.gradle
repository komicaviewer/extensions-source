apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 34
    namespace "tw.kevinzhang.newshub.extension.lib.${project.name.replace('-', '_')}"

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
    sourceSets.test.java.srcDir rootProject.file('shared/broker-http/src/test/kotlin')
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        freeCompilerArgs.add('-Xjspecify-annotations=ignore')
    }
}

dependencies {
    implementation project(':shared:broker-http')
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiAar = file("${newshubDir}/extension-api/build/outputs/aar/extension-api-debug.aar")
        if (!extensionApiAar.exists()) {
            throw new GradleException(
                "Local extension-api AAR not found at ${extensionApiAar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:assembleDebug"
            )
        }
        // Android library modules cannot publish an AAR that directly embeds another
        // local AAR. Extract the API bytecode only; the owning APK supplies the full
        // extension-api AAR (including AIDL and manifest) at the application boundary.
        def extensionApiJar = layout.buildDirectory.file('local-extension-api/extension-api.jar')
        def extractExtensionApi = tasks.register('extractLocalExtensionApiJar', Copy) {
            from(zipTree(extensionApiAar)) { include 'classes.jar'; rename { 'extension-api.jar' } }
            into(layout.buildDirectory.dir('local-extension-api'))
            inputs.file(extensionApiAar)
            outputs.file(extensionApiJar)
        }
        def extensionApiFiles = files(extensionApiJar).builtBy(extractExtensionApi)
        compileOnly extensionApiFiles
        testImplementation extensionApiFiles
    } else {
        compileOnly 'com.github.komicaviewer.NewsHub:extension-api:53d421492614c13e2a5984b4991513d993d44246'
        testImplementation 'com.github.komicaviewer.NewsHub:extension-api:53d421492614c13e2a5984b4991513d993d44246'
    }

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'ru.gildor.coroutines:kotlin-coroutines-okhttp:1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
