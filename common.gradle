apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

assert extName != null : "extName is not set in build.gradle.kts"
assert extVersionCode != null : "extVersionCode is not set in build.gradle.kts"

android {
    compileSdk 34
    namespace "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"

    defaultConfig {
        applicationId "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"
        minSdk 21
        targetSdk 34
        versionCode extVersionCode
        versionName extVersionName ?: "1.0"

        manifestPlaceholders = [
            extName : extName,
        ]
    }

    signingConfigs {
        release {
            storeFile = file("${rootProject.projectDir}/keystore.jks")
            storePassword = System.getenv("KEY_STORE_PASSWORD") ?: ""
            keyAlias = System.getenv("KEY_ALIAS") ?: ""
            keyPassword = System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (new File("${rootProject.projectDir}/keystore.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
}

dependencies {
    // A local NewsHub checkout lets extensions validate a pending extension-api change
    // before the corresponding JitPack artifact is published.
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiJar = file("${newshubDir}/extension-api/build/libs/extension-api.jar")
        if (!extensionApiJar.exists()) {
            throw new GradleException(
                "Local extension-api JAR not found at ${extensionApiJar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:jar"
            )
        }
        compileOnly files(extensionApiJar)
        testImplementation files(extensionApiJar)
    } else {
        // extension-api from the canonical NewsHub repository via JitPack
        compileOnly 'com.github.komicaviewer.NewsHub:extension-api:6bb40c6b3cbe73c5f09f6fa3502ad038acb8cf19'
        testImplementation 'com.github.komicaviewer.NewsHub:extension-api:6bb40c6b3cbe73c5f09f6fa3502ad038acb8cf19'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'ru.gildor.coroutines:kotlin-coroutines-okhttp:1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
