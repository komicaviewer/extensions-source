apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

assert extName != null : "extName is not set in build.gradle.kts"
assert extVersionCode != null : "extVersionCode is not set in build.gradle.kts"

android {
    compileSdk 34
    namespace "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"

    defaultConfig {
        applicationId "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"
        minSdk 29
        targetSdk 34
        versionCode extVersionCode
        versionName extVersionName ?: "1.0"

        manifestPlaceholders = [
            extName : extName,
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
    sourceSets.test.java.srcDir rootProject.file('shared/broker-http/src/test/kotlin')
}

dependencies {
    implementation project(':shared:broker-http')
    // A local NewsHub checkout lets extensions validate a pending extension-api change
    // before the corresponding JitPack artifact is published.
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiAar = file("${newshubDir}/extension-api/build/outputs/aar/extension-api-debug.aar")
        if (!extensionApiAar.exists()) {
            throw new GradleException(
                "Local extension-api AAR not found at ${extensionApiAar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:assembleDebug"
            )
        }
        implementation files(extensionApiAar)
        testImplementation files(extensionApiAar)
    } else {
        // extension-api from the canonical NewsHub repository via JitPack
        implementation 'com.github.komicaviewer.NewsHub:extension-api:aeabde818066dd31a65bf6cd253a004792819b1b'
        testImplementation 'com.github.komicaviewer.NewsHub:extension-api:aeabde818066dd31a65bf6cd253a004792819b1b'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'ru.gildor.coroutines:kotlin-coroutines-okhttp:1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
