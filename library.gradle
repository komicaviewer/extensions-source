apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

assert libraryNamespace != null : "libraryNamespace is not set in build.gradle.kts"
assert engineFlavors != null : "engineFlavors is not set in build.gradle.kts"

android {
    compileSdk 34
    namespace libraryNamespace

    defaultConfig {
        minSdk 21
    }

    flavorDimensions 'engine'
    engineFlavors.each { flavorName ->
        productFlavors.create(flavorName) {
            dimension 'engine'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
}

dependencies {
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiJar = file("${newshubDir}/extension-api/build/libs/extension-api.jar")
        if (!extensionApiJar.exists()) {
            throw new GradleException(
                "Local extension-api JAR not found at ${extensionApiJar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:jar"
            )
        }
        compileOnly files(extensionApiJar)
        testImplementation files(extensionApiJar)
    } else {
        compileOnly 'com.github.komicaviewer.NewsHub:extension-api:5b5d4e571afb60ce0ce1084b074381fda7664c84'
        testImplementation 'com.github.komicaviewer.NewsHub:extension-api:5b5d4e571afb60ce0ce1084b074381fda7664c84'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'ru.gildor.coroutines:kotlin-coroutines-okhttp:1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
