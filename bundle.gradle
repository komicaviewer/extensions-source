apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

assert bundleName != null : "bundleName is not set in build.gradle.kts"
assert bundleVersionCode != null : "bundleVersionCode is not set in build.gradle.kts"

android {
    compileSdk 34
    namespace "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"

    defaultConfig {
        applicationId "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"
        minSdk 21
        targetSdk 34
        versionCode bundleVersionCode
        versionName bundleVersionName ?: "1.0"

        manifestPlaceholders = [
            bundleName: bundleName,
        ]
    }

    signingConfigs {
        release {
            storeFile = file("${rootProject.projectDir}/keystore.jks")
            storePassword = System.getenv("KEY_STORE_PASSWORD") ?: ""
            keyAlias = System.getenv("KEY_ALIAS") ?: ""
            keyPassword = System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (new File("${rootProject.projectDir}/keystore.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
}

dependencies {
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiJar = file("${newshubDir}/extension-api/build/libs/extension-api.jar")
        if (!extensionApiJar.exists()) {
            throw new GradleException(
                "Local extension-api JAR not found at ${extensionApiJar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:jar"
            )
        }
        compileOnly files(extensionApiJar)
    } else {
        compileOnly 'com.github.komicaviewer.NewsHub:extension-api:6bb40c6b3cbe73c5f09f6fa3502ad038acb8cf19'
    }
}
