apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

assert bundleName != null : "bundleName is not set in build.gradle.kts"
assert bundleVersionCode != null : "bundleVersionCode is not set in build.gradle.kts"

def newshubEnv = (findProperty('newshubEnv') ?: 'prod').toString()
def newshubEnvironments = [
    prod: [suffix: '', bindPermission: 'tw.kevinzhang.newshub.permission.BIND_EXTENSION'],
    dev : [suffix: '.debug', bindPermission: 'tw.kevinzhang.newshub.debug.permission.BIND_EXTENSION'],
]
if (!newshubEnvironments.containsKey(newshubEnv)) {
    throw new GradleException("Unknown newshubEnv '${newshubEnv}'; expected one of ${newshubEnvironments.keySet()}")
}
def newshubEnvConfig = newshubEnvironments[newshubEnv]

android {
    compileSdk 34
    namespace "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"

    defaultConfig {
        applicationId "tw.kevinzhang.newshub.extension.${project.name.replace('-', '_')}"
        minSdk 29
        targetSdk 34
        versionCode bundleVersionCode
        versionName bundleVersionName ?: "1.0"

        // 後綴只加在 applicationId；namespace 不變，Service 類別名稱仍解析自原 namespace。
        applicationIdSuffix newshubEnvConfig.suffix

        manifestPlaceholders = [
            bundleName: bundleName,
            newshubBindPermission: newshubEnvConfig.bindPermission,
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjspecify-annotations=ignore']
    }
}

dependencies {
    def newshubDir = providers.gradleProperty('newshubDir').orNull
    if (newshubDir != null) {
        def extensionApiAar = file("${newshubDir}/extension-api/build/outputs/aar/extension-api-debug.aar")
        if (!extensionApiAar.exists()) {
            throw new GradleException(
                "Local extension-api AAR not found at ${extensionApiAar}. " +
                    "Build it first with: cd ${newshubDir} && ./gradlew :extension-api:assembleDebug"
            )
        }
        implementation files(extensionApiAar)
    } else {
        implementation 'com.github.komicaviewer.NewsHub:extension-api:7c2d23ec9ec27e161a1a70fca84c9da00d9763cd'
    }
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
