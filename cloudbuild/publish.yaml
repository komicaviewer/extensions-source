    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-eyny-key-password/versions/latest, env: EYNY_KEY_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-eyny-cert-sha256/versions/latest, env: EYNY_SIGNING_CERT_SHA256}
