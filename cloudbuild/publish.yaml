    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-gamer-key-password/versions/latest, env: GAMER_KEY_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-gamer-cert-sha256/versions/latest, env: GAMER_SIGNING_CERT_SHA256}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-hackernews-key-b64/versions/latest, env: HACKERNEWS_SIGNING_KEY_B64}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-hackernews-store-password/versions/latest, env: HACKERNEWS_KEY_STORE_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-hackernews-alias/versions/latest, env: HACKERNEWS_KEY_ALIAS}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-hackernews-key-password/versions/latest, env: HACKERNEWS_KEY_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-hackernews-cert-sha256/versions/latest, env: HACKERNEWS_SIGNING_CERT_SHA256}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica-key-b64/versions/latest, env: KOMICA_SIGNING_KEY_B64}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica-store-password/versions/latest, env: KOMICA_KEY_STORE_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica-alias/versions/latest, env: KOMICA_KEY_ALIAS}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica-key-password/versions/latest, env: KOMICA_KEY_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica-cert-sha256/versions/latest, env: KOMICA_SIGNING_CERT_SHA256}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica2-key-b64/versions/latest, env: KOMICA2_SIGNING_KEY_B64}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica2-store-password/versions/latest, env: KOMICA2_KEY_STORE_PASSWORD}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica2-alias/versions/latest, env: KOMICA2_KEY_ALIAS}
    - {versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-extensions-sign-komica2-key-password/versions/latest, env: KOMICA2_KEY_PASSWORD}
