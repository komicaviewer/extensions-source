# Bounded main-branch release build. Publisher and signing material comes from
# one strictly validated, version-pinned Secret Manager bundle. No long-lived
# GitHub token is stored.
timeout: 3000s
queueTtl: 600s

options:
  machineType: E2_STANDARD_2
  diskSizeGb: 80
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE

serviceAccount: projects/$PROJECT_ID/serviceAccounts/${_PUBLISH_SERVICE_ACCOUNT}

substitutions:
  _REPOSITORY_URL: https://github.com/komicaviewer/extensions-source.git
  # Controller must override this with the exact squash merge commit emitted by
  # the independently authorized merge gate. Direct/manual submission fails closed.
  _SOURCE_SHA: REQUIRED_EXACT_MERGE_COMMIT_SHA
  _NEWSHUB_API_SHA: 53d421492614c13e2a5984b4991513d993d44246
  _DISTRIBUTION_REPOSITORY: komicaviewer/extensions
  _DISTRIBUTION_URL: https://github.com/komicaviewer/extensions.git
  _ANDROID_BUILDER_IMAGE: REQUIRED_DIGEST_PINNED_ANDROID_IMAGE
  _OPS_BUILDER_IMAGE: REQUIRED_DIGEST_PINNED_OPS_IMAGE
  _PUBLISH_SERVICE_ACCOUNT: extensions-publisher@$PROJECT_ID.iam.gserviceaccount.com
  _SECRET_PREFIX: REQUIRED_SECRET_PREFIX
  _PUBLISHER_SIGNING_BUNDLE_VERSION: REQUIRED_PINNED_SECRET_VERSION
  _PUBLISHER_GITHUB_APP_ID: REQUIRED_PUBLISHER_GITHUB_APP_ID
  _PUBLISHER_GITHUB_APP_INSTALLATION_ID: REQUIRED_PUBLISHER_GITHUB_APP_INSTALLATION_ID
  _TUF_TARGETS_A_SECRET_VERSION: REQUIRED_PINNED_TUF_TARGETS_A_SECRET_VERSION
  _TUF_TARGETS_B_SECRET_VERSION: REQUIRED_PINNED_TUF_TARGETS_B_SECRET_VERSION
  _TUF_SNAPSHOT_SECRET_VERSION: REQUIRED_PINNED_TUF_SNAPSHOT_SECRET_VERSION
  _TUF_TIMESTAMP_SECRET_VERSION: REQUIRED_PINNED_TUF_TIMESTAMP_SECRET_VERSION
  _TUF_TARGETS_A_KEY_ID: REQUIRED_TUF_TARGETS_A_KEY_ID
  _TUF_TARGETS_B_KEY_ID: REQUIRED_TUF_TARGETS_B_KEY_ID
  _TUF_SNAPSHOT_KEY_ID: REQUIRED_TUF_SNAPSHOT_KEY_ID
  _TUF_TIMESTAMP_KEY_ID: REQUIRED_TUF_TIMESTAMP_KEY_ID

steps:
  - id: checkout-exact-source
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    env:
      - REPOSITORY_URL=${_REPOSITORY_URL}
      - SOURCE_SHA=${_SOURCE_SHA}
      - NEWSHUB_API_SHA=${_NEWSHUB_API_SHA}
    args:
      - -ceu
      - |
        [[ "$${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
        [[ "$${NEWSHUB_API_SHA}" =~ ^[0-9a-f]{40}$ ]]
        rm -rf /workspace/source /workspace/trusted-newshub /workspace/unsigned /workspace/apks /workspace/distribution /workspace/baseline /workspace/secure
        git init /workspace/source
        git -C /workspace/source remote add origin "$${REPOSITORY_URL}"
        git -C /workspace/source fetch --no-tags --depth=1 origin "$${SOURCE_SHA}"
        git -C /workspace/source checkout --detach "$${SOURCE_SHA}"
        git init /workspace/trusted-newshub
        git -C /workspace/trusted-newshub remote add origin https://github.com/komicaviewer/NewsHub.git
        git -C /workspace/trusted-newshub fetch --no-tags --depth=1 origin "$${NEWSHUB_API_SHA}"
        git -C /workspace/trusted-newshub checkout --detach "$${NEWSHUB_API_SHA}"

  - id: validate-catalog-and-tools
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    dir: source
    timeout: 300s
    args:
      - -ceu
      - |
        python3 scripts/release_catalog.py validate
        python3 scripts/validate_source_manifests.py
        python3 -m unittest discover -s scripts -p 'test_*.py'

  - id: build-unsigned
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    dir: source
    timeout: 1800s
    waitFor: [validate-catalog-and-tools]
    args:
      - -ceu
      - |
        export ANDROID_SDK_ROOT="$${ANDROID_SDK_ROOT:-$${ANDROID_HOME:-/opt/android-sdk}}"
        aapt="$${ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt"
        test -x "$${aapt}"
        rm -rf /workspace/android-build-tools
        cp -a "$${ANDROID_SDK_ROOT}/build-tools/34.0.0" /workspace/android-build-tools
        /workspace/trusted-newshub/gradlew -p /workspace/trusted-newshub --no-daemon :extension-api:assembleDebug
        mapfile -t gradle_tasks < <(python3 scripts/release_catalog.py gradle-tasks)
        test "$${#gradle_tasks[@]}" -gt 0
        ./gradlew --no-daemon -PnewshubDir=/workspace/trusted-newshub "$${gradle_tasks[@]}"
        mkdir -p /workspace/unsigned
        while IFS=$'\t' read -r module apk; do
          test -f "$${apk}"
          version=$("$${aapt}" dump badging "$${apk}" 2>/dev/null | \
            sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/p" | head -n 1)
          test -n "$${version}"
          apk_name=$(python3 scripts/release_catalog.py artifact-name "$${module}" "$${version}")
          cp "$${apk}" "/workspace/unsigned/$${apk_name}"
        done < <(python3 scripts/release_catalog.py artifact-rows)

  - id: materialize-publisher-signing-bundle
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 120s
    waitFor: [build-unsigned]
    secretEnv: [PUBLISHER_SIGNING_BUNDLE]
    args:
      - -ceu
      - |
        set +x
        umask 077
        install -d -m 700 /workspace/secure
        raw_bundle=/workspace/secure/publisher-signing-bundle.json
        cleanup() {
          find "$${raw_bundle}" -type f -exec shred -u {} + 2>/dev/null || rm -f -- "$${raw_bundle}"
        }
        trap cleanup EXIT
        printf '%s' "$${PUBLISHER_SIGNING_BUNDLE}" > "$${raw_bundle}"
        chmod 600 "$${raw_bundle}"
        python3 /workspace/source/scripts/materialize_publisher_signing_bundle.py \
          --input "$${raw_bundle}" \
          --output-dir /workspace/secure/publisher

  - id: sign-eyny
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module eyny --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/eyny.json']

  - id: sign-gamer
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module gamer --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/gamer.json']

  - id: sign-hackernews
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module hackernews --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/hackernews.json']

  - id: sign-komica
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module komica --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/komica.json']

  - id: sign-komica2
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module komica2 --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/komica2.json']

  - id: sign-mobile01
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module mobile01 --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/mobile01.json']

  - id: sign-ptt
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [materialize-publisher-signing-bundle]
    args: [-ceu, 'python3 /workspace/source/scripts/sign_release_bundle.py --module ptt --input-dir /workspace/unsigned --output-dir /workspace/apks --apksigner /workspace/android-build-tools/apksigner --credentials-file /workspace/secure/publisher/signing/ptt.json']

  - id: materialize-tuf-targets-a
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 120s
    waitFor: [build-unsigned]
    secretEnv: [TUF_TARGETS_A_KEY]
    args:
      - -ceu
      - |
        set +x
        umask 077
        install -d -m 700 /workspace/secure/tuf
        raw=$$(mktemp /workspace/secure/tuf/targets-a.XXXXXX)
        trap 'find "$${raw}" -delete 2>/dev/null || true' EXIT
        printf '%s' "$${TUF_TARGETS_A_KEY}" > "$${raw}"
        chmod 600 "$${raw}"
        python3 /workspace/source/scripts/materialize_tuf_role_key.py \
          --input "$${raw}" --expected-role targets --expected-slot a \
          --expected-key-id "${_TUF_TARGETS_A_KEY_ID}" \
          --output /workspace/secure/tuf/targets-a.pem

  - id: materialize-tuf-targets-b
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 120s
    waitFor: [build-unsigned]
    secretEnv: [TUF_TARGETS_B_KEY]
    args:
      - -ceu
      - |
        set +x
        umask 077
        install -d -m 700 /workspace/secure/tuf
        raw=$$(mktemp /workspace/secure/tuf/targets-b.XXXXXX)
        trap 'find "$${raw}" -delete 2>/dev/null || true' EXIT
        printf '%s' "$${TUF_TARGETS_B_KEY}" > "$${raw}"
        chmod 600 "$${raw}"
        python3 /workspace/source/scripts/materialize_tuf_role_key.py \
          --input "$${raw}" --expected-role targets --expected-slot b \
          --expected-key-id "${_TUF_TARGETS_B_KEY_ID}" \
          --output /workspace/secure/tuf/targets-b.pem

  - id: materialize-tuf-snapshot
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 120s
    waitFor: [build-unsigned]
    secretEnv: [TUF_SNAPSHOT_KEY]
    args:
      - -ceu
      - |
        set +x
        umask 077
        install -d -m 700 /workspace/secure/tuf
        raw=$$(mktemp /workspace/secure/tuf/snapshot.XXXXXX)
        trap 'find "$${raw}" -delete 2>/dev/null || true' EXIT
        printf '%s' "$${TUF_SNAPSHOT_KEY}" > "$${raw}"
        chmod 600 "$${raw}"
        python3 /workspace/source/scripts/materialize_tuf_role_key.py \
          --input "$${raw}" --expected-role snapshot --expected-slot primary \
          --expected-key-id "${_TUF_SNAPSHOT_KEY_ID}" \
          --output /workspace/secure/tuf/snapshot.pem

  - id: materialize-tuf-timestamp
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 120s
    waitFor: [build-unsigned]
    secretEnv: [TUF_TIMESTAMP_KEY]
    args:
      - -ceu
      - |
        set +x
        umask 077
        install -d -m 700 /workspace/secure/tuf
        raw=$$(mktemp /workspace/secure/tuf/timestamp.XXXXXX)
        trap 'find "$${raw}" -delete 2>/dev/null || true' EXIT
        printf '%s' "$${TUF_TIMESTAMP_KEY}" > "$${raw}"
        chmod 600 "$${raw}"
        python3 /workspace/source/scripts/materialize_tuf_role_key.py \
          --input "$${raw}" --expected-role timestamp --expected-slot primary \
          --expected-key-id "${_TUF_TIMESTAMP_KEY_ID}" \
          --output /workspace/secure/tuf/timestamp.pem

  - id: mint-short-lived-github-token
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: python3
    timeout: 120s
    waitFor: [sign-eyny, sign-gamer, sign-hackernews, sign-komica, sign-komica2, sign-mobile01, sign-ptt]
    env:
      - GITHUB_APP_ID=${_PUBLISHER_GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${_PUBLISHER_GITHUB_APP_INSTALLATION_ID}
      - GITHUB_APP_REPOSITORY=extensions
    args:
      - /workspace/source/scripts/github_app_token.py
      - --private-key
      - /workspace/secure/publisher/github-app-private-key.pem
      - --output
      - /workspace/secure/github-token

  - id: checkout-current-distribution
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 300s
    waitFor: [mint-short-lived-github-token]
    env:
      - DISTRIBUTION_URL=${_DISTRIBUTION_URL}
    args:
      - -ceu
      - |
        cat > /workspace/secure/askpass.sh <<'SH'
        #!/bin/sh
        case "$${1}" in
          *Username*) echo x-access-token ;;
          *) cat /workspace/secure/github-token ;;
        esac
        SH
        chmod 700 /workspace/secure/askpass.sh
        GIT_ASKPASS=/workspace/secure/askpass.sh GIT_TERMINAL_PROMPT=0 \
          git clone --no-tags "$${DISTRIBUTION_URL}" /workspace/distribution

  - id: generate-and-admit-distribution
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 600s
    waitFor: [checkout-current-distribution, materialize-tuf-targets-a, materialize-tuf-targets-b, materialize-tuf-snapshot, materialize-tuf-timestamp]
    args:
      - -ceu
      - |
        export PYTHONDONTWRITEBYTECODE=1
        aapt=/workspace/android-build-tools/aapt
        apksigner=/workspace/android-build-tools/apksigner
        mkdir -p /workspace/baseline
        cp -a /workspace/distribution/. /workspace/baseline/
        python3 /workspace/source/scripts/validate_release_bundles.py /workspace/apks
        python3 /workspace/source/scripts/generate_index.py /workspace/apks /workspace/distribution \
          --aapt "$${aapt}" --apksigner "$${apksigner}"
        python3 /workspace/source/scripts/validate_distribution.py /workspace/distribution \
          --baseline-dir /workspace/baseline --aapt "$${aapt}" --apksigner "$${apksigner}"
        rm -rf /workspace/trusted-metadata-output
        python3 /workspace/source/scripts/generate_trusted_metadata.py \
          --distribution /workspace/distribution \
          --output /workspace/trusted-metadata-output \
          --policy /workspace/distribution/policy/admission_policy.json \
          --root /workspace/distribution/policy/tuf/root.json \
          --catalog /workspace/source/release-catalog.json \
          --targets-key /workspace/secure/tuf/targets-a.pem \
          --targets-key /workspace/secure/tuf/targets-b.pem \
          --snapshot-key /workspace/secure/tuf/snapshot.pem \
          --timestamp-key /workspace/secure/tuf/timestamp.pem \
          --apksigner "$${apksigner}"
        rm -rf /workspace/distribution/metadata /workspace/distribution/targets
        mv /workspace/trusted-metadata-output/metadata /workspace/distribution/metadata
        mv /workspace/trusted-metadata-output/targets /workspace/distribution/targets
        python3 /workspace/distribution/policy/admission_gate.py \
          --candidate /workspace/distribution \
          --base /workspace/baseline \
          --policy-root /workspace/baseline/policy \
          --aapt "$${aapt}" --apksigner "$${apksigner}"

  - id: publish-exact-distribution-pr
    name: ${_ANDROID_BUILDER_IMAGE}
    entrypoint: python3
    timeout: 300s
    waitFor: [generate-and-admit-distribution]
    env:
      - DESTINATION_REPOSITORY=${_DISTRIBUTION_REPOSITORY}
      - SOURCE_SHA=${_SOURCE_SHA}
      - CLOUD_BUILD_ID=$BUILD_ID
    args:
      - /workspace/source/scripts/publish_distribution_pr.py
      - --repo
      - /workspace/distribution
      - --repository
      - ${_DISTRIBUTION_REPOSITORY}
      - --token-file
      - /workspace/secure/github-token
      - --build-id
      - $BUILD_ID
      - --source-sha
      - ${_SOURCE_SHA}

  - id: cleanup-private-material
    name: ${_OPS_BUILDER_IMAGE}
    entrypoint: bash
    timeout: 60s
    waitFor: [publish-exact-distribution-pr]
    args:
      - -ceu
      - |
        find /workspace/secure -type f -exec shred -u {} + 2>/dev/null || true
        rm -rf -- /workspace/secure

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-publisher-signing-bundle/versions/${_PUBLISHER_SIGNING_BUNDLE_VERSION}
      env: PUBLISHER_SIGNING_BUNDLE
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-tuf-targets-a-key/versions/${_TUF_TARGETS_A_SECRET_VERSION}
      env: TUF_TARGETS_A_KEY
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-tuf-targets-b-key/versions/${_TUF_TARGETS_B_SECRET_VERSION}
      env: TUF_TARGETS_B_KEY
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-tuf-snapshot-key/versions/${_TUF_SNAPSHOT_SECRET_VERSION}
      env: TUF_SNAPSHOT_KEY
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}-tuf-timestamp-key/versions/${_TUF_TIMESTAMP_SECRET_VERSION}
      env: TUF_TIMESTAMP_KEY
